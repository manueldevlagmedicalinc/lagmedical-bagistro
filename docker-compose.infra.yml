services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: lagmedical_npm
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "127.0.0.1:${NPM_ADMIN_PORT:-81}:81"
      - "${NPM_HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-America/New_York}
      DISABLE_IPV6: ${NPM_DISABLE_IPV6:-true}
      IP_RANGES_FETCH_ENABLED: ${NPM_IP_RANGES_FETCH_ENABLED:-false}
    volumes:
      - ${NPM_DATA_PATH:-./docker/infra/npm/data}:/data
      - ${NPM_LETSENCRYPT_PATH:-./docker/infra/npm/letsencrypt}:/etc/letsencrypt
    networks:
      lagmedical_proxy:
        aliases:
          - npm

networks:
  lagmedical_proxy:
    name: lagmedical_proxy
    external: true
