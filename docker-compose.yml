services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lagmedical_web
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - lagmedical
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:stable-alpine
    container_name: lagmedical_nginx
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - lagmedical
      - lagmedical_proxy
    depends_on:
      - web
  db:
    image: mariadb:10.11
    container_name: lagmedical_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - lagmedical_db_data:/var/lib/mysql
    networks:
      - lagmedical

  redis:
    image: redis:7-alpine
    container_name: lagmedical_redis
    restart: unless-stopped
    networks:
      - lagmedical

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: lagmedical_phpmyadmin
    restart: unless-stopped
    profiles:
      - dev
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 512M
    ports:
      - "8086:80"
    networks:
      - lagmedical
    depends_on:
      - db

volumes:
  lagmedical_db_data:

networks:
  lagmedical:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
  lagmedical_proxy:
    external: true
